name: Public Crypto Bounty Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 14 * * *'

concurrency:
  group: bounty-scan-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal runtime dependency
        run: python -m pip install 'aiohttp>=3.9,<4'
      - name: Unit tests (offline)
        run: |
          python -m unittest discover -s tests -p 'test_bounty_hunter.py' -v
          python -m unittest discover -s tests -p 'test_bounty_triage.py' -v
          python -m unittest discover -s tests -p 'test_bounty_push_queue_oidc.py' -v
          python -m unittest discover -s tests -p 'test_bounty_check_queue_status.py' -v
      - name: Base Everest offline competition intake (no external target testing)
        run: |
          python -m unittest discover -s tests -p 'test_base_everest_intake.py' -v
          python crypto/base_everest_intake.py --output artifacts/base-everest-intake.json
      - name: ZEUS pinned-source review (read-only, not a PoC)
        run: |
          python -m unittest discover -s tests -p 'test_zeus_research.py' -v
          python zeus.py run-once --intent "Base Everest bounty hunt organ" --estimated-value-usd 250000 --output artifacts/base-everest-source-review.json
      - name: Everest local-host preflight diagnostics (no devnet startup)
        run: |
          python -m unittest discover -s tests -p 'test_everest_host_preflight.py' -v
          python scripts/everest_host_preflight.py --output artifacts/everest-host-preflight.json
          bash -n scripts/everest_local_devnet.sh
      - name: Query live public feeds over HTTPS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python crypto/bounty_hunter.py scan --db artifacts/bounties.sqlite3 --output artifacts/latest-bounties.json --limit 1000
          python crypto/bounty_hunter.py report --db artifacts/bounties.sqlite3 --output artifacts/earnings-report.json
          python crypto/bounty_triage.py --input artifacts/latest-bounties.json --output-dir artifacts/
      - name: Sync public discoveries to guarded staging queue
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python crypto/push_queue_oidc.py --input artifacts/latest-bounties.json
      - name: Verify both persistent discovery feeds
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: python crypto/check_queue_status.py
      - name: Summary
        if: always()
        run: |
          if [ -f artifacts/latest-bounties.json ]; then
            python - <<'PY'
          import json, os
          with open('artifacts/latest-bounties.json', encoding='utf-8') as f:
              result=json.load(f)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(f"## Public bounty discovery\n\nFound {result['discovered']} listed opportunities.\n\n")
              f.write(f"Source errors: {len(result['source_errors'])}.\n\n")
              f.write("No bounty tasks performed, no submissions sent, and no payouts credited.\n")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bounty-scan-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
