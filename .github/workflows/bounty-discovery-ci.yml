name: Bounty Discovery CI
on:
  push:
    branches:
      - main
      - feat/read-only-crypto-bounty-discovery-20261117
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install durable queue test dependencies
        run: python -m pip install 'redis>=5,<7' 'fakeredis>=2,<3' 'PyJWT[crypto]>=2.8,<3'
      - name: Compile read-only service
        run: python -m py_compile bounty_discovery_service.py
      - name: Unit tests, no external network
        run: python -m unittest discover -s tests -p 'test_bounty_*.py' -v
      - name: Validate browser command center JavaScript
        if: matrix.python-version == '3.12'
        run: node --check dashboard.js
      - name: Verify production Docker build and imports
        if: matrix.python-version == '3.12'
        run: |
          docker build -t garcar-bounty-review:ci .
          docker run --rm --entrypoint python garcar-bounty-review:ci -c "import bounty_discovery_service, bounty_work_queue, bounty_intelligence, blockscout_evidence, immunefi_review, rhns_governance; print('runtime_imports_ok')"
